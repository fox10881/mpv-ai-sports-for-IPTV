تشغيل	cycle pause		hidden=not pause and not idle_active	disabled=idle_active
إيقاف مؤقت	cycle pause		hidden=idle_active or pause
إيقاف	stop			hidden=idle ~= true						disabled=idle_active

فتح
	الحافظة		update-clipboard text; loadfile ${clipboard/text}; show-text '+ ${clipboard/text}'
	السجل		script-binding select/select-watch-history
	المشاهدة لاحقاً	script-binding select/select-watch-later
قائمة التشغيل	$playlist

المسارات	$tracks
التشغيل
	مدة العرض	hidden=not p["current-tracks/video/image"] or p["current-tracks/audio"]
		1 ثانية		set image-display-duration 1		checked=image_display_duration == 1
		2 ثانية		set image-display-duration 2		checked=image_display_duration == 2
		5 ثوانٍ		set image-display-duration 5		checked=image_display_duration == 5
		10 ثوانٍ		set image-display-duration 10		checked=image_display_duration == 10
		بلا نهاية		set image-display-duration inf		checked=image_display_duration == math.huge
	السرعة
		25%		set speed 0.25		checked=speed == 0.25
		50%		set speed 0.50		checked=speed == 0.50
		75%		set speed 0.75		checked=speed == 0.75
		&100%	set speed 1			checked=speed == 1
		1&25%	set speed 1.25		checked=speed == 1.25
		1&50%	set speed 1.50		checked=speed == 1.50
		1&75%	set speed 1.75		checked=speed == 1.75
		&200%	set speed 2			checked=speed == 2
		&400%	set speed 4			checked=speed == 4
		&800%	set speed 8			checked=speed == 8

	تعيين/مسح نقطتي التكرار A-B	ab-loop
	تكرار الملف		cycle-values loop-file inf no		checked=loop_file == "inf"
	تكرار القائمة	cycle-values loop-playlist inf no	checked=loop_playlist == "inf"

	تقديم 10 ثوانٍ	seek  10	hidden=p["current-tracks/video/image"] and not p["current-tracks/audio"]
	إرجاع 10 ثوانٍ	seek -10	hidden=p["current-tracks/video/image"] and not p["current-tracks/audio"]
	تقديم 10 دقائق	seek  600	hidden=p["current-tracks/video/image"] and not p["current-tracks/audio"]
	إرجاع 10 دقائق	seek -600	hidden=p["current-tracks/video/image"] and not p["current-tracks/audio"]

	إعادة التحميل		set file-local-options/start ${=time-pos}; playlist-play-index current yes; show-text "Reloading current file..."

	الملف التالي		playlist-next	disabled=playlist_count < 2
	الملف السابق	playlist-prev	disabled=playlist_count < 2

	القائمة الفرعية التالية		playlist-next-playlist	disabled=playlist_count < 2
	القائمة الفرعية السابقة	playlist-prev-playlist	disabled=playlist_count < 2

	خلط	playlist-shuffle
	إلغاء الخلط	playlist-unshuffle
الفصول			$chapters
الإصدارات/العناوين	$editions

فيديو
	المسار	$video-tracks

	ملء		no-osd cycle-values panscan 0 1; no-osd set video-unscaled no; no-osd set video-zoom 0		checked=panscan == 1
	تمديد	no-osd cycle keepaspect																		checked=not keepaspect
	الحجم الأصلي	no-osd cycle-values video-unscaled yes no; no-osd set video-zoom 0; no-osd set panscan 0	checked=video_unscaled
	تكبير
		&50%	set video-zoom -1	checked=video_zoom == -1
		&100%	set video-zoom  0	checked=video_zoom == 0
		&200%	set video-zoom  1	checked=video_zoom == 1
	نسبة العرض
		&16:9		set video-aspect-override 16:9		checked=math.abs(video_aspect_override - 16/9) < 1e-12
		&4:3		set video-aspect-override 4:3		checked=math.abs(video_aspect_override - 4/3) < 1e-12
		&2.35:1		set video-aspect-override 2.35:1	checked=video_aspect_override == 2.35
		الافتراضي	set video-aspect-override no		checked=video_aspect_override == -2
	توسيط		no-osd set video-pan-x 0; no-osd set video-pan-y 0; no-osd set video-align-x 0; no-osd set video-align-y 0		disabled=video_pan_x == 0 and video_pan_y == 0 and video_align_x == 0 and video_align_y == 0

	تدوير مع عقارب الساعة			cycle-values video-rotate 90 180 270 0
	تدوير عكس عقارب الساعة	cycle-values video-rotate 270 180 90 0

	إزالة التدرج			cycle deband		checked=deband
	إزالة التشابك	cycle deinterlace	checked=deinterlace_active

	لقطة شاشة						screenshot			disabled=not p["current-tracks/video"]
	لقطة بدون ترجمة	screenshot video	disabled=not p["current-tracks/video"]
صوت
	المسار		$audio-tracks
	الأجهزة	$audio-devices
	القنوات
		تلقائي		set audio-channels auto-safe	checked=audio_channels == "auto-safe"
		ستيريو		set audio-channels stereo		checked=audio_channels == "stereo"
		أحادي		set audio-channels mono			checked=audio_channels == "mono"

	رفع الصوت	add volume  2
	خفض الصوت	add volume -2
	كتم				cycle mute		checked=mute

	زيادة التأخير		add audio-delay  0.1
	إنقاص التأخير		add audio-delay -0.1
ترجمة
	المسار		$sub-tracks
	إظهار	cycle sub-visibility	checked=sub_visibility

	زيادة التأخير		add sub-delay  0.1
	إنقاص التأخير		add sub-delay -0.1

	تكبير		add sub-scale  0.1
	تصغير		add sub-scale -0.1

	الأسطر	script-binding select/select-subtitle-line	disabled=not sid or p["current-tracks/sub/codec"] == "dvb_subtitle" or p["current-tracks/sub/codec"] == "dvd_subtitle" or p["current-tracks/sub/codec"] == "hdmv_pgs_subtitle"
	الترجمة الثانوية
		المسار		$secondary-sub-tracks
		إظهار	cycle secondary-sub-visibility	checked=secondary_sub_visibility

		زيادة التأخير		add secondary-sub-delay  0.1
		إنقاص التأخير		add secondary-sub-delay -0.1

		الأسطر	script-binding select/select-secondary-subtitle-line	disabled=not secondary_sid or p["current-tracks/sub2/codec"] == "dvb_subtitle" or p["current-tracks/sub2/codec"] == "dvd_subtitle" or p["current-tracks/sub2/codec"] == "hdmv_pgs_subtitle"

النافذة
	ملء الشاشة		cycle fullscreen	checked=fullscreen
	الإطار			cycle border		checked=border
	شريط العنوان		cycle title-bar		checked=title_bar
	دائماً في الأعلى	cycle ontop			checked=ontop
	حجم النافذة
		50%		set window-scale 0.5	checked=math.abs(get("current-window-scale", 0) - 0.5) < 0.1
		100%	set window-scale 1		checked=math.abs(get("current-window-scale", 0) - 1) < 0.1
		200%	set window-scale 2		checked=math.abs(get("current-window-scale", 0) - 2) < 0.1
		300%	set window-scale 3		checked=math.abs(get("current-window-scale", 0) - 3) < 0.1
	لقطة النافذة	screenshot window
