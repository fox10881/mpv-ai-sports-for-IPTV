vo=gpu
gpu-api=d3d11
# Zero-copy d3d11va crashed the DLSS 5 add-on (0xC0000005 in d3d11.dll during its
# D3D12->D3D11 blit) in every test that reached playback; -copy was far more stable
hwdec=d3d11va-copy

# Dumb-mode forces mpv to skip internal FBOs (rgba16hf) and pass the frame directly
gpu-dumb-mode=yes
dither=no

# Aggressive IPTV Caching & Reconnects
cache=yes
demuxer-max-bytes=1000MiB
demuxer-readahead-secs=30
cache-pause-initial=yes
cache-pause-wait=10
stream-lavf-o=reconnect=1,reconnect_streamed=1,reconnect_delay_max=2
# live_start_index=-1: join live HLS at the newest segment, not 3 segments back
demuxer-lavf-o=fflags=+discardcorrupt,live_start_index=-1
# Never save or restore playback positions (live streams must always start live)
save-position-on-quit=no
resume-playback=no
# Absorb DLSS 5 add-on Present stalls (~250ms on feature build) without device underruns
audio-buffer=1


sub-codepage=cp1256
sub-font="Arial"
sub-font-size=42
sub-color="#FFFFFF"
sub-border-color="#000000"
sub-border-size=3.2
